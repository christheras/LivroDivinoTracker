<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dusk Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: três colunas separadas por linhas tracejadas (Forja, Personagem, Tracker). Em tela média o tracker desce; no celular tudo empilha.
   Visual: grafite chapado, grade discreta, títulos em mono azul, slots tracejados. Cores de status são semânticas e separadas do azul de interface. */
:root{
  --bg:#1a1d21; --grid:rgba(255,255,255,.028);
  --surface:#22262b; --surface-2:#1d2125;
  --line:#2f353c; --line-soft:#272c32;
  --ink:#d5dae1; --ink-dim:#8d97a5; --ink-faint:#5b6572;
  --accent:#6b8fe0; --accent-line:#3d63b8;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);font:14px/1.4 var(--font-body);font-variant-numeric:tabular-nums;
  padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,select{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul,ol{list-style:none;margin:0;padding:0}

.wrap{position:relative;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.wrap::before,.wrap::after{content:"+";position:absolute;top:-6px;font:400 16px/1 var(--font-mono);color:var(--accent-line)}
.wrap::before{left:-12px}.wrap::after{right:-12px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px}
.top h1{margin:0;font:600 18px/1.2 var(--font-mono);letter-spacing:.16em;text-transform:uppercase}
.top p{margin:6px 0 0;color:var(--ink-dim);font-size:13.5px;max-width:74ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.legend span{display:inline-flex;align-items:center;gap:7px;font:400 12px var(--font-mono);color:var(--ink-dim)}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.legend i.grad{background:linear-gradient(90deg,#ea4b50,#f5c518)}

.board{display:grid;grid-template-columns:minmax(0,370px) minmax(0,410px) minmax(0,1fr);align-items:start}
.sec{min-width:0;padding:0 26px}
.sec:first-child{padding-left:0}
.sec:last-child{padding-right:0}
.sec+.sec{border-left:1px dashed var(--line)}
@media (max-width:1200px){
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:36px}
  .sec:nth-child(2){padding-right:0}
  .tracker{grid-column:1/-1;border-left:0!important;padding:30px 0 0!important;border-top:1px dashed var(--line)}
}
@media (max-width:760px){
  .board{grid-template-columns:minmax(0,1fr)}
  .sec,.sec:nth-child(2){border-left:0!important;padding:0!important}
  .sec+.sec{border-top:1px dashed var(--line);padding-top:30px!important}
}

/* cabeçalhos de seção */
.sh{display:flex;align-items:center;gap:12px;margin:0 0 14px;font:500 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh::after{content:"";flex:1;min-width:12px;border-top:1px dashed var(--line)}
.sh.sub{margin:28px 0 6px;color:var(--ink-dim)}
.sh small{font:400 11px var(--font-mono);letter-spacing:.04em;text-transform:none;color:var(--ink-faint);white-space:normal}

/* abas */
.tabs{display:flex;flex-wrap:wrap;align-items:center;margin:0 0 14px;row-gap:6px}
.tw{display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-left:1px solid var(--line)}
.tw:first-child{padding-left:0;border-left:0}
.tab{font:600 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);padding:6px 2px 5px;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.add{color:var(--accent)}
.tdel{font:500 11px var(--font-mono);color:var(--ink-faint);padding:2px 5px;border-radius:4px}
.tdel:hover{color:#ff8f93}
.tdel.ask{color:#ff8f93;border:1px solid #6b2f33}

.btn{height:28px;padding:0 14px;border-radius:6px;border:1px solid var(--accent-line);color:#bcd0ff;font:600 11.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.btn:hover:not(:disabled){background:rgba(107,143,224,.14)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{height:26px;padding:0 10px}
.btn.ghost{border-color:var(--line);color:var(--ink-dim)}
.sbtn{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);font:500 15px/1 var(--font-mono);color:var(--ink-dim)}
.sbtn:hover{border-color:var(--accent-line);color:var(--ink)}
.num{width:56px;height:26px;text-align:right;background:#15181b;border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:0 6px;font:500 13px var(--font-mono)}
.num::-webkit-inner-spin-button{opacity:.35}

/* ---------- Forja ---------- */
.groups{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 14px}
.gp{font-size:13px;color:var(--ink-dim);padding:2px 0;border-bottom:1px solid transparent}
.gp:hover{color:var(--ink)}
.gp.on{color:var(--ink);border-bottom-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.tile{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:0;border-radius:2px;border:1px solid #3a4149;
  background:#14171a;box-shadow:inset 0 2px 4px rgba(0,0,0,.55);color:color-mix(in srgb,var(--sc,#8d97a5) 85%,white);
  }
.tile svg{width:56%;height:56%}
.tile img,.slot img,.pic img,.msi img{display:block;width:100%;height:100%;object-fit:cover}
.tile .lv{text-shadow:0 1px 2px #000,0 0 3px #000}
.tile:hover{border-color:var(--ink-faint)}
.tile.gold{border-color:#6f6030}
.tile.on{border-color:var(--c)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile .lv{position:absolute;left:3px;top:2px;font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.78)}
.tile .dot{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.tile.unk{background:transparent;border:1px dashed var(--line-soft);color:var(--ink-faint);font:500 14px var(--font-mono);cursor:default;box-shadow:none}
.empty-note{margin:10px 0 0;color:var(--ink-dim);font-size:13px}
.fdetail{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.selname{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;font:600 17px var(--font-body);min-height:22px}
.selname small{font:400 12px var(--font-mono);color:var(--ink-dim);letter-spacing:.04em}
.selname.none{color:var(--ink-dim);font-weight:400;font-size:14px}
.meta{margin:-6px 0 0;color:var(--ink-dim);font-size:12.5px}
.mslots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.ms{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.msi{width:100%;max-width:46px;aspect-ratio:1;border-radius:2px;border:1px solid #3a4149;background:#14171a;box-shadow:inset 0 2px 4px rgba(0,0,0,.55);overflow:hidden;position:relative}
.msi .tile{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
.msn{min-width:34px;height:20px;padding:0 6px;border:1px solid var(--c,var(--line));border-radius:4px;display:grid;place-items:center;font:600 12px var(--font-mono);color:var(--c,var(--ink-dim))}
.mst{font-size:11.5px;color:var(--ink-dim);text-align:center;line-height:1.2;min-height:14px}
.souls{color:var(--ink-dim);font-size:12.5px;margin:0}
.acts{display:flex;gap:10px;margin-top:2px}

/* ícone de material (cor = raridade) */
.mi{display:grid;place-items:center;width:100%;height:100%;background:color-mix(in srgb,var(--mc) 12%,var(--surface-2));color:color-mix(in srgb,var(--mc) 82%,white)}
.mi svg{width:58%;height:58%}
.mi img{display:block;width:100%;height:100%;object-fit:cover}

/* ---------- Personagem ---------- */
.equip{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 18px;margin:8px 0 6px}
.eq3,.eq2{display:grid;gap:16px 8px;align-content:start}
.eq3{grid-template-columns:repeat(3,1fr)}
.eq2{grid-template-columns:repeat(2,1fr);padding-left:18px;border-left:1px dashed var(--line)}
.ec{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.ec>span{font-size:11.5px;color:var(--ink-dim);text-align:center;line-height:1.15}
.ec.off>span{font-style:italic;color:var(--ink-faint)}
.slot{position:relative;width:100%;max-width:46px;aspect-ratio:1;border-radius:2px;border:1px dashed var(--accent-line);background:#14171a;box-shadow:inset 0 2px 4px rgba(0,0,0,.55);color:var(--ink-faint);display:grid;place-items:center;padding:0}
.slot svg{width:54%;height:54%;opacity:.5}
.slot .plus{position:absolute;font:500 16px/1 var(--font-mono);color:var(--accent)}
.slot.off{border-color:var(--line)}
.slot.off .plus{display:none}
.slot.full{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--sc) 11%,var(--surface));color:color-mix(in srgb,var(--sc) 85%,white)}
.slot.full svg{opacity:1;width:58%;height:58%}
.slot.full{overflow:hidden}
.slot.full .plus{display:none}
.slot.target{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px rgba(107,143,224,.3)}
.slot.over{background:#27303f}
.slot .ck{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#4aa3ff;display:grid;place-items:center;border:2px solid var(--bg)}
.slot .ck svg{width:9px;height:9px;opacity:1}
.bag{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;background:#14171a;border:1px solid #3a4149;border-radius:2px;box-shadow:inset 0 2px 4px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.03);padding:0;overflow:hidden;display:block}
button.cell:hover{border-color:var(--accent-line)}
.cell .qn{position:absolute;right:3px;bottom:1px;font:600 10.5px/1.2 var(--font-mono);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.invfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.hint{color:var(--ink-dim);font-size:12.5px;flex:1;min-width:150px}

/* ---------- Tracker ---------- */
.sum{display:grid;gap:10px;padding:2px 0 4px}
.sumhead{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.sumhead .big{font:600 20px var(--font-body);color:var(--c)}
.sumhead .d{color:var(--ink-dim);font-size:13.5px}
.bar{height:5px;border-radius:3px;background:#12151a;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c);transition:width .25s}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px}
.facts div{display:flex;flex-direction:column}
.facts span{font:400 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.facts b{font:600 18px var(--font-mono)}
.mrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.mic{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mmain{min-width:0}
.mtop{display:flex;align-items:baseline;gap:2px 10px;flex-wrap:wrap}
.mtop b{font-weight:600;font-size:14.5px}
.mtop em{font-style:normal;font:600 11.5px var(--font-mono);letter-spacing:.02em;color:var(--c)}
.tag{font:500 10.5px var(--font-mono);padding:0 6px;border-radius:4px;border:1px solid currentColor;line-height:1.55}
.tag.d{color:#f0b429}.tag.r{color:#ef6b6b}.tag.b{color:#5aa7ff}
.mrow .bar{margin:6px 0 4px;height:4px}
.mnote{font-size:12px;color:var(--ink-dim)}
.mnote.src{color:var(--ink-faint)}
.mcount{display:flex;align-items:center;gap:4px}
.need{min-width:38px;color:var(--ink-dim);font:500 12.5px var(--font-mono);padding-left:4px}
.mrow.idle{opacity:.5}
.mrow.idle .bar i{width:0!important}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.addrow select{flex:1;min-width:180px;max-width:320px;height:28px;background:#15181b;border:1px solid var(--line);border-radius:5px;padding:0 8px;font-size:13px}

.piece{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.phead{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.pic{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc,#8d97a5) 11%,var(--surface));color:color-mix(in srgb,var(--sc,#8d97a5) 85%,white)}
.pic svg{width:58%;height:58%}
.pic{overflow:hidden}
.piece.ghost{opacity:.45}
.piece.ghost .mtop em{color:var(--ink-dim)}
.pact{display:flex;align-items:center;gap:6px}
.xbtn,.x{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);font:500 14px/1 var(--font-mono);color:var(--ink-dim)}
.x:hover{border-color:#8a3a3f;color:#ff8f93}
.xbtn:hover{border-color:var(--accent-line);color:var(--ink)}
.steps{margin:10px 0 0 48px;display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 10px;border:1px solid var(--line-soft);border-radius:6px;background:var(--surface-2)}
.step .tgl{grid-row:span 2}
.sname{font-weight:600;font-size:13.5px}
.sname small{font:400 11.5px var(--font-mono);color:var(--ink-dim);margin-left:6px}
.sname em{font-style:normal;font:600 11.5px var(--font-mono);color:var(--c);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 11%,transparent)}
.tgl{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);font:500 11.5px var(--font-mono);color:var(--ink-dim);white-space:nowrap}
.tgl:hover{border-color:var(--accent-line);color:var(--ink)}
.tgl[aria-pressed="true"]{background:rgba(74,163,255,.14);border-color:#4aa3ff;color:#bfe0ff}
.note{margin:18px 0 0;color:var(--ink-faint);font-size:12.5px;max-width:78ch}
@media (max-width:560px){
  .mrow{grid-template-columns:36px minmax(0,1fr)}
  .mcount{grid-column:2}
  .steps{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Dusk Tracker</h1>
      <p>Escolha a peça numa fornalha de Dusk, coloque no personagem e acompanhe materiais, Almas e Essências do Crepúsculo. Receitas da wiki PW Brasil e de um guia de fórum; tabelas de drop de IronfreaK.</p>
    </div>
    <div class="legend" aria-label="Legenda de cores">
      <span><i style="--c:#ea4b50"></i>Não iniciado</span>
      <span><i class="grad"></i>Em progresso</span>
      <span><i style="--c:#3fbf6f"></i>Suficiente</span>
      <span><i style="--c:#4aa3ff"></i>Forjado</span>
    </div>
  </header>
  <main class="board">
    <section class="sec forge" id="forge" aria-label="Forja"></section>
    <section class="sec inv" id="inv" aria-label="Personagem"></section>
    <section class="sec tracker" id="tracker" aria-label="Tracker de materiais"></section>
  </main>
</div>

  if(!isDone)it.so.forEach((sid,i)=>build(sid,key+'>'+i+':'+sid,depth+1,done,out));
  out.push({key:key,item:it,depth:depth,done:isDone,root:depth===0});
}

/* ---------- Status e cálculo ---------- */
const COL={red:'#ea4b50',green:'#3fbf6f',blue:'#4aa3ff',dim:'#7b93a4'};
const stat=(pct,done,L)=>{
  L=L||{};
  if(done)return {k:'done',c:COL.blue,t:L.done||'Concluído'};
  if(pct>=1)return {k:'ok',c:COL.green,t:L.ok||'Suficiente'};
  if(pct<=0)return {k:'none',c:COL.red,t:L.none||'Não iniciado'};
  return {k:'part',c:'hsl('+Math.round(4+46*pct)+' 90% 56%)',t:L.part||'Em progresso'};
};
const ORDER=['weapon','head','body','legs','feet','hands','cape','neck','orn'];
const reqsOf=it=>it.m.map(x=>({n:x[0],q:x[1]})).concat(it.e?[{n:ESS,q:it.e}]:[]);

function calc(){
  const rem={};Object.keys(S.inv).forEach(k=>{rem[k]=S.inv[k]||0});
  const pieces={},need={},total={};
  ORDER.forEach(sl=>{
    const e=S.equipped[sl];if(!e)return;
    const steps=[];build(e.id,e.id,0,e.done||{},steps);
    let a=0,b=0,pend=0,ready=0;
    steps.forEach(st=>{
      st.reqs=reqsOf(st.item);
      st.reqs.forEach(r=>{total[r.n]=(total[r.n]||0)+r.q});
      if(st.done){st.pct=1;st.stat=stat(1,true,{done:st.root?'Forjada':'Alma pronta'});return}
      let sa=0,sb=0;
      st.reqs.forEach(r=>{
        need[r.n]=(need[r.n]||0)+r.q;
        const have=rem[r.n]||0,take=Math.min(have,r.q);rem[r.n]=have-take;r.take=take;sa+=take;sb+=r.q;
      });
      st.pct=sb?sa/sb:1;st.ready=sa===sb;a+=sa;b+=sb;pend++;if(st.ready)ready++;
      st.stat=stat(st.pct,false,{ok:'Pronta para forjar',none:'Não iniciada',part:'Em progresso'});
    });
    const root=steps[steps.length-1],crafted=root.done,pct=crafted?1:(b?a/b:1);
    pieces[sl]={item:ITEM[e.id],e:e,steps:steps,crafted:crafted,pct:pct,pend:pend,ready:ready,
      stat:crafted?stat(1,true,{done:'Forjada'}):stat(pct,false,{ok:'Materiais completos',none:'Não iniciada',part:'Em progresso'})};
  });
  return {pieces:pieces,need:need,total:total};
}

function srcLine(n){
  const s=SRC[n];if(!s)return n===ESS?'Forja: 5 Tábua Polida + 5 Carvão de Pedra + 5 Pó de Esmeril + 5 Aço Temperado.':'Origem não identificada na tabela de drops.';
  const T=DR.chapters;
  const txt=s.map(x=>x.boss+' · Cap. '+x.ch+' · '+T[x.ch-1].tiers[x.tier-1]);
  const seen=[],uniq=txt.filter(t=>seen.indexOf(t)<0&&seen.push(t));
  return 'Onde farmar: '+uniq.slice(0,2).join(' / ')+(uniq.length>2?' (+'+(uniq.length-2)+')':'');
}
function mrow(n){
  const have=S.inv[n]||0,need=C.need[n]||0,tot=C.total[n]||0;
  let st,note,pct,use=true;
  if(need>0){pct=Math.min(have/need,1);st=stat(pct,false);note=have>need?'sobram '+(have-need):have===need?'na medida':'faltam '+(need-have)}
  else if(tot>0){pct=1;st=stat(1,true);note='as peças que usam já foram forjadas'}
  else{pct=0;st={c:COL.dim,t:'Sem uso agora'};note='nenhuma peça equipada usa';use=false}
  const r=rar(n),tag=(r==='d'||r==='r'||r==='b')?'<span class="tag '+r+'">'+RTXT[r]+'</span>':'';
  return {name:n,use:use,html:
    '<li class="mrow'+(use?'':' idle')+'" style="--c:'+st.c+'">'
    +'<span class="mic">'+matIcon(n)+'</span>'
    +'<div class="mmain"><div class="mtop"><b>'+esc(n)+'</b>'+tag+'<em>'+st.t+'</em></div><div class="bar"><i style="width:'+Math.round(pct*100)+'%"></i></div><div class="mnote">'+note+'</div><div class="mnote src">'+esc(srcLine(n))+'</div></div>'
    +'<div class="mcount"><button class="sbtn" data-act="istep" data-m="'+MIDX[n]+'" data-d="-1" aria-label="Diminuir '+esc(n)+'">−</button>'
    +'<input class="num" id="inv-'+MIDX[n]+'" data-m="'+MIDX[n]+'" type="number" min="0" value="'+have+'" inputmode="numeric" aria-label="'+esc(n)+' no inventário">'
    +'<button class="sbtn" data-act="istep" data-m="'+MIDX[n]+'" data-d="1" aria-label="Aumentar '+esc(n)+'">+</button>'
    +'<span class="need" title="Necessário">/ '+(need||'—')+'</span></div></li>'};
}
function trackerHTML(){
  const pc=C.pieces,placed=Object.keys(pc).length;
  const crafted=ORDER.filter(s=>pc[s]&&pc[s].crafted).length;
  const pend=placed-crafted;
  const stepsReady=ORDER.reduce((a,s)=>a+(pc[s]?pc[s].ready:0),0);
  let needSum=0,haveSum=0,missing=0,missEss=0;
  Object.keys(C.need).forEach(n=>{const q=C.need[n],h=S.inv[n]||0;needSum+=q;haveSum+=Math.min(q,h);missing+=Math.max(0,q-h);if(n===ESS)missEss=Math.max(0,q-h)});
  let sm;
  if(!placed)sm={c:COL.dim,t:'Nada equipado',pct:0,d:'Escolha uma peça numa fornalha e coloque no personagem.'};
  else if(!pend)sm={c:COL.blue,t:'Tudo forjado',pct:1,d:'As peças equipadas já foram forjadas.'};
  else{
    const p=needSum?haveSum/needSum:1;
    const st=stat(p,false,{none:'Não iniciado',part:'Em progresso',ok:'Materiais suficientes'});
    sm={c:st.c,t:st.t,pct:p,d:missing?'Faltam '+missing+' materiais (contando Essências) para '+pend+(pend===1?' peça pendente.':' peças pendentes.'):'Nada falta para as peças pendentes.'};
  }
  const names=ALLM.filter(n=>n!==ESS&&((C.total[n]||0)>0||(S.inv[n]||0)>0||S.watch.indexOf(n)>=0));
  const rows=names.map(mrow);
  const sec={0:[],1:[],2:[],3:[]};
  rows.forEach(r=>sec[chOf(r.name)].push(r));
  const mord=n=>(n in MORD)?MORD[n]:9999;
  const secHTML=[1,2,3,0].map(ch=>{
    const arr=sec[ch];if(!arr.length)return '';
    arr.sort((a,b)=>(a.use===b.use?0:a.use?-1:1)||mord(a.name)-mord(b.name));
    const T=DR.chapters[ch-1];
    const h=ch?'<h2 class="sh sub"><span>Cap. '+ch+' · '+T.name+'</span><small>chefe em modo Alto gasta '+T.ess+' Essência'+(T.ess>1?'s':'')+'</small></h2>':'<h2 class="sh sub"><span>Outros materiais</span><small>nome como aparece na wiki</small></h2>';
    return h+'<ul>'+arr.map(r=>r.html).join('')+'</ul>';
  }).join('');
  const ess=mrow(ESS).html;
  const avail=ALLM.filter(n=>n!==ESS&&names.indexOf(n)<0);
  const sel='<div class="addrow"><select id="addmat" aria-label="Material para acompanhar">'+avail.map(n=>'<option value="'+MIDX[n]+'">'+esc(n)+'</option>').join('')+'</select><button class="btn sm" data-act="addmat"'+(avail.length?'':' disabled')+'>Acompanhar</button></div>';
  const prows=ORDER.map(sl=>{
    const p=pc[sl],nm=SLOT_BY[sl].name;
    if(!p)return '<li class="piece ghost"><div class="phead"><span class="pic">'+svg(G[sl==='weapon'?'sword':sl])+'</span><div class="pmain"><div class="mtop"><b>'+nm+'</b><em>Vazio</em></div><div class="mnote">Escolha na Forja uma peça para este slot.</div></div><div></div></div></li>';
    const it=p.item,open=S.open[sl]!==false;
    const stepsHTML=open?'<ol class="steps">'+p.steps.map(st=>{
      const chips=st.reqs.map(r=>{
        const c=st.done?COL.blue:stat(r.take/r.q,false).c;
        return '<span class="chip" style="--c:'+c+'">'+r.q+' '+esc(r.n)+'</span>';
      }).join('');
      return '<li class="step" style="--c:'+st.stat.c+'"><button class="tgl" data-act="done" data-slot="'+sl+'" data-key="'+esc(st.key)+'" aria-pressed="'+st.done+'">'+(st.root?'Forjada':'Alma pronta')+'</button>'
        +'<div class="sname">'+esc(st.item.n)+'<small>NV '+st.item.l+'</small><em>'+st.stat.t+'</em></div><div class="chips">'+chips+'</div></li>';
    }).join('')+'</ol>':'';
    return '<li class="piece" style="--c:'+p.stat.c+';--sc:'+tcol(it)+'"><div class="phead"><span class="pic">'+glyphOf(it)+'</span>'
      +'<div class="pmain"><div class="mtop"><b>'+esc(it.n)+'</b><span class="mnote">NV '+it.l+'</span><em>'+p.stat.t+'</em></div><div class="mnote">'+nm+' · '+p.steps.length+(p.steps.length===1?' etapa':' etapas')+(p.pend?' · '+p.pend+' a forjar':'')+'</div></div>'
      +'<div class="pact">'+(p.steps.length>1?'<button class="xbtn" data-act="open" data-slot="'+sl+'" aria-label="'+(open?'Recolher':'Expandir')+' etapas" aria-expanded="'+open+'">'+(open?'−':'+')+'</button>':'')+'<button class="x" data-act="remove" data-slot="'+sl+'" aria-label="Remover '+esc(it.n)+'">×</button></div></div>'+stepsHTML+'</li>';
  }).join('');
  return ''
  +'<h2 class="sh"><span>Tracker · '+esc(S.sets[S.cur].name)+' · '+pend+' a forjar</span></h2>'
  +'<div class="sum" style="--c:'+sm.c+'"><div class="sumhead"><span class="big">'+sm.t+'</span><span class="d">'+sm.d+'</span></div>'
  +'<div class="bar"><i style="width:'+Math.round(sm.pct*100)+'%"></i></div>'
  +'<div class="facts"><div><span>No personagem</span><b>'+placed+'</b></div><div><span>Etapas prontas</span><b>'+stepsReady+'</b></div><div><span>Forjadas</span><b>'+crafted+'</b></div><div><span>Essências faltando</span><b>'+missEss+'</b></div></div></div>'
  +'<h2 class="sh sub"><span>Essência do Crepúsculo</span><small>gasta em toda forja de Dusk e por chefes em modo Alto</small></h2><ul>'+ess+'</ul>'
  +secHTML+sel
  +'<h2 class="sh sub"><span>Peças no personagem</span></h2><ul>'+prows+'</ul>'
  +'<p class="note">Cada peça avançada exige a Alma da peça anterior, então a lista mostra a cadeia completa na ordem de forja. Marque "Alma pronta" nas etapas que você já tem. O estoque é o que você digita; marcar uma etapa não desconta materiais. Os materiais são distribuídos pelas etapas na ordem da lista, da primeira à última peça.</p>';
}

/* ---------- Render ---------- */
const $forge=document.getElementById('forge'),$inv=document.getElementById('inv'),$trk=document.getElementById('tracker');
function render(){
  C=calc();
  const a=document.activeElement;
  const keep=(a&&a.tagName==='INPUT'&&a.id)?a:null;
  let range=null;
  if(keep){try{range=[keep.selectionStart,keep.selectionEnd]}catch(e){}}
  $forge.innerHTML=forgeHTML();
  $inv.innerHTML=invHTML();
  $trk.innerHTML=trackerHTML();
  if(keep){
    const n=document.getElementById(keep.id);
    if(n&&n!==keep){
      n.replaceWith(keep);keep.focus();
      try{if(range&&range[0]!=null)keep.setSelectionRange(range[0],range[1])}catch(e){}
    }
  }
}

/* ---------- Ações ---------- */
function equipItem(id){
  const it=ITEM[id];if(!it||!it.s||it.nr)return;
  const cur=S.equipped[it.s];
  if(cur&&cur.id===id)return;
  S.equipped[it.s]={id:id,done:{}};
  save();
}
function slotClick(slot){
  const sel=S.sel&&ITEM[S.sel];
  if(sel&&sel.s===slot){equipItem(sel.id);return}
  const e=S.equipped[slot];
  if(e){const it=ITEM[e.id];S.furn=it.f;S.group=it.g;S.sel=it.id}
}
const mname=el=>ALLM[Number(el.dataset.m)];
function useSet(i){S.cur=i;S.equipped=S.sets[i].equipped;S.confirmDel=-1}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const d=Number(el.dataset.d||0);
  switch(el.dataset.act){
    case 'furn':S.furn=el.dataset.id;S.group=GROUPS[S.furn][0];S.sel=null;save();break;
    case 'group':S.group=el.dataset.g;S.sel=null;save();break;
    case 'tile':S.sel=el.dataset.id;break;
    case 'equip':if(S.sel)equipItem(S.sel);break;
    case 'cancel':S.sel=null;break;
    case 'slot':slotClick(el.dataset.slot);break;
    case 'istep':{const n=mname(el);S.inv[n]=Math.max(0,(S.inv[n]||0)+d);save();break}
    case 'done':{const x=S.equipped[el.dataset.slot];if(x){x.done=x.done||{};const k=el.dataset.key;if(x.done[k])delete x.done[k];else x.done[k]=true;save()}break}
    case 'remove':delete S.equipped[el.dataset.slot];save();break;
    case 'open':S.open[el.dataset.slot]=!(S.open[el.dataset.slot]!==false);break;
    case 'set':useSet(Number(el.dataset.i));save();break;
    case 'newset':S.sets.push({name:'Set '+(S.sets.length+1),equipped:{}});useSet(S.sets.length-1);save();break;
    case 'delset':{
      const i=Number(el.dataset.i);
      if(S.confirmDel===i){S.sets.splice(i,1);useSet(Math.min(S.cur,S.sets.length-1));save()}
      else{S.confirmDel=i;clearTimeout(delTimer);delTimer=setTimeout(()=>{S.confirmDel=-1;render()},3000)}
      break}
    case 'clear':
      if(S.confirm){S.sets[S.cur].equipped={};S.equipped=S.sets[S.cur].equipped;S.confirm=false;clearTimeout(confirmTimer);save()}
      else{S.confirm=true;clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{S.confirm=false;render()},3000)}
      break;
    case 'addmat':{const s=document.getElementById('addmat');if(s&&s.value!==''){const n=ALLM[Number(s.value)];if(S.watch.indexOf(n)<0)S.watch.push(n);save()}break}
    case 'stack':{
      const inp=document.getElementById('inv-'+el.dataset.m);
      if(inp){inp.scrollIntoView({block:'center',behavior:'smooth'});inp.focus();inp.select()}
      return;
    }
    default:return;
  }
  render();
});

document.addEventListener('dblclick',e=>{
  const el=e.target.closest('[data-act="slot"]');
  if(el&&S.equipped[el.dataset.slot]){delete S.equipped[el.dataset.slot];save();render()}
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.m!==undefined&&t.tagName==='INPUT'){S.inv[ALLM[Number(t.dataset.m)]]=Math.max(0,parseInt(t.value,10)||0);save();render()}
});

/* Arrastar da Forja para o personagem */
document.addEventListener('dragstart',e=>{
  const t=e.target.closest&&e.target.closest('[data-act="tile"]');
  if(!t)return;
  drag=t.dataset.id;
  try{e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move'}catch(_){}
  const target=document.querySelector('.slot[data-slot="'+ITEM[drag].s+'"]');
  if(target)target.classList.add('target');
});
document.addEventListener('dragover',e=>{
  const s=e.target.closest&&e.target.closest('.slot[data-slot]');
  if(drag&&s&&ITEM[drag].s===s.dataset.slot){e.preventDefault();s.classList.add('over')}
});
document.addEventListener('dragleave',e=>{
  const s=e.target.closest&&e.target.closest('.slot[data-slot]');
  if(s)s.classList.remove('over');
});
document.addEventListener('drop',e=>{
  const s=e.target.closest&&e.target.closest('.slot[data-slot]');
  if(drag&&s&&ITEM[drag].s===s.dataset.slot){
    e.preventDefault();
    S.sel=drag;equipItem(drag);drag=null;render();
  }
});
document.addEventListener('dragend',()=>{if(drag){drag=null;render()}});

render();
})();
</script>

</body>
</html>
