<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker de Dusk</title>
<style>
:root{--bg:#EDF1EF;--surface:#fff;--fg:#15211E;--muted:#4F5F5A;--line:#CFD9D5;--accent:#0B6B55}
@media (prefers-color-scheme:dark){:root{--bg:#0D1412;--surface:#151F1C;--fg:#E5EEEB;--muted:#98AAA4;--line:#28372F;--accent:#4CC9A0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;padding:72px 16px 32px}
.sw{position:fixed;top:12px;left:16px;height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.sw:hover,.sw:focus-visible{border-color:var(--accent)}
.sw span{color:var(--accent)}
main{max-width:520px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
h1{margin:0 0 8px;font-size:26px}p{margin:0;color:var(--muted)}
.c{margin-top:22px;font-size:13px}.c a{color:var(--accent)}
</style>
</head>
<body>
<a class="sw" href="../" aria-label="Voltar ao tracker de livros divinos"><span aria-hidden="true">&#8644;</span>Tracker de Livros Divinos</a>
<main>
  <h1>Tracker de Dusk</h1>
  <p>Em construção. Em breve aqui.</p>
  <p class="c">Feito por <b>Heras</b>, junto com o Claude · <a href="https://www.youtube.com/@christheras" target="_blank" rel="noopener">youtube.com/@christheras</a></p>
</main>
</body>
</html>
